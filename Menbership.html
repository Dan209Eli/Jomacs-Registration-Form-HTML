        <meta charset="UTF-8">

    <body>
        <h1>Jomacs Member Registration</h1>
        <form action="#" method="post"> <fieldset>
            <legend>Personal Information</legend>
            <label for="full_name">Full Name</label>
            <br><input type="text" id="full_name" name="full_name" required><br><br>
            <label for="email">Email Address</label>
            <br><input type="email" id="email" name="email" required><br><br>
            <label for="phone_number">Phone Number</label>
            <br><input type="number" id="phone_number" required><br><br>
            <label for="date_of_birth">Date of Birth</label>
            <br><input type="date" id="dob" name="dob" required><br><br>
            <label>Gender</label><br>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female" required>
            <label for="male">Female</label>
            <input type="radio" id="other" name="gender" value="other" required>
            <label for="male">Other</label><br><br>
            </fieldset><br><br>
            <label for="address">Address</label><br>
            <textarea id="address" rows="5" cols="50" required></textarea><br><br>
            <label for="membership">Membership Type</label><br>
            <select id="membership" name="membership"><option value="regular">Regular</option><option value="regular">Associate</option></select><br><br>
            <input type="checkbox" id="newsletter" name="newsletter" value="subscribe"><label for="newsletter">Subscribe to Newsletter</label><br><br>
            <input type="submit" value="Submit"><input type="reset" value="Reset">
        </form>
    </body>
